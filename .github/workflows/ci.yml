name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm --filter extension typecheck

      - name: Unit tests
        run: pnpm --filter extension test

      - name: Build extension (MV3)
        run: pnpm --filter extension build

      - name: Package zip
        run: pnpm --filter extension zip

      - name: Upload installable artifact
        uses: actions/upload-artifact@v4
        with:
          name: themepark-extension
          path: extension/build/*.zip
          if-no-files-found: error

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify tag matches package version
        run: |
          PKG_VERSION="v$(node -p "require('./extension/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match extension version $PKG_VERSION"
            exit 1
          fi

      - name: Build extension (MV3)
        run: pnpm --filter extension build

      - name: Package with stable asset name
        run: |
          pnpm --filter extension zip
          cp extension/build/extension-*-chrome.zip ThemePark-chrome.zip
          # Theme packs: one zip per directory, stable name = folder name.
          # python zipfile — available on all runners, unlike `zip`.
          python3 - <<'PY'
          import zipfile, pathlib
          out = pathlib.Path('theme-assets'); out.mkdir(exist_ok=True)
          for d in pathlib.Path('themes').iterdir():
              if not (d / 'manifest.json').is_file():
                  continue
              zpath = out / f'ThemePark-{d.name}-theme.zip'
              with zipfile.ZipFile(zpath, 'w', zipfile.ZIP_DEFLATED) as z:
                  for f in sorted(d.rglob('*')):
                      if f.is_file():
                          z.write(f, f.relative_to(d))
              print('zipped', zpath)
          PY
          ls -la ThemePark-chrome.zip theme-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ThemePark-chrome.zip
            theme-assets/*.zip
          generate_release_notes: true
